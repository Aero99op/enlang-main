<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlang Full-Stack Demo (HTML + CSS + JS in English)</title>
  <link rel="stylesheet" href="test_styles.enlgd">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 32px; border-radius: 12px; border: 1px solid #334155; }
    h1, h2, h3 { color: #38bdf8; }
    button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #0369a1; }
    input { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Enlang Full-Stack Engine</h1>
    <p>HTML (.enlgf) + CSS (.enlgd) + JS (.enlgs) — 100% Pure English!</p>
    <h2>Interactive Counter Component</h2>
    <p>Current Count: </p>
    <h3 id="counter-display">0</h3>
    <button id="inc-btn" class="button">Increment Count</button>
    <button id="toggle-btn" class="button">Toggle Dark Mode</button>
    <h2>API Login Form</h2>
    <p>status</p>
    <input type="text" id="username-input" placeholder="Enter your username">
    <button class="button">Submit API Login</button>
  </div>
  <script src="test_script.enlgs"></script>
</body>
</html>
