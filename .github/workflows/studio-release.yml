name: Release Enlangg Studio

on:
  push:
    tags:
      - 'studio-v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check tag matches desktop/package.json version
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}" -replace '^studio-v', ''
          $pkg = (Get-Content desktop\package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) { throw "Tag version $tag does not match desktop/package.json version $pkg" }
          "STUDIO_VERSION=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Studio carries the seven tools in resources\bin. desktop/prep-ui.js copies them from the
      # repository folder, where they are not committed, so they are built here first, with the
      # same commands as the Windows build of release.yml.
      - name: Build the seven tools for Studio
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function Build([string[]]$a) { & gcc @a; if ($LASTEXITCODE -ne 0) { throw "gcc failed: $($a -join ' ')" } }
          Build @('-O2','-s','-I.','-Isrc','-Ienlngdb/c','-Ienlng/c','enlangg.c','enlngdb/c/enlngdb.c','enlngdb/c/enlngdb_parser.c','enlng/c/enlng_emitter.c','-lm','-o','enlangg.exe')
          Build @('-O2','-s','-I.','-Isrc','enlng.c','-lm','-o','enlng.exe')
          Build @('-O2','-s','-I.','-Isrc','-Ienlngdb/c','enlngdb/c/main.c','enlngdb/c/enlngdb.c','enlngdb/c/enlngdb_parser.c','-lm','-o','enlngdb.exe')
          Build @('-O2','-s','-I.','-Isrc','-Ienlngf/c','enlngf.c','-lws2_32','-lgdi32','-luser32','-lm','-o','enlngf.exe')
          Build @('-O2','-s','-I.','-Isrc','-Ienlngs/c','enlngs.c','-lm','-o','enlngs.exe')
          Build @('-O2','-s','-I.','-Isrc','-Ienlngd/c','enlngd.c','-lm','-o','enlngd.exe')
          Build @('-O2','-s','-I.','-Isrc','-Ienlngm/c','enlngm.c','-lgdi32','-luser32','-lm','-o','enlngm.exe')
          $want = ((Select-String -Path src\enlangg_version.h -Pattern '^#define ENLANGG_VERSION "(.*)"').Matches[0].Groups[1].Value)
          foreach ($t in 'enlangg','enlng','enlngdb','enlngf','enlngd','enlngs','enlngm') {
            $v = (& ".\$t.exe" --version | Select-Object -First 1)
            Write-Host "$t : $v"
            if ($v -notmatch [regex]::Escape("version $want")) { throw "$t.exe says '$v', expected version $want" }
          }

      - name: Install dependencies
        shell: powershell
        working-directory: desktop
        run: |
          $out = cmd /c "npm install --no-audit --no-fund 2>&1" | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $tail = $out.Substring([Math]::Max(0, $out.Length - 3000)) -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=npm install failed::$tail"
            exit 1
          }

      - name: Build Studio installer (unsigned)
        shell: powershell
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $out = cmd /c "npm run dist 2>&1" | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $tail = $out.Substring([Math]::Max(0, $out.Length - 3000)) -replace "`r", "" -replace "`n", "%0A"
            Write-Host "::error title=Studio build failed::$tail"
            exit 1
          }

      - name: Stage release files and checksum
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = "dist-desktop\Enlangg Studio-Setup-$env:STUDIO_VERSION.exe"
          if (-not (Test-Path $src)) { Get-ChildItem dist-desktop | Out-Host; throw "Installer not found: $src" }
          foreach ($t in 'enlangg','enlng','enlngdb','enlngf','enlngd','enlngs','enlngm') {
            if (-not (Test-Path "dist-desktop\win-unpacked\resources\bin\$t.exe")) { throw "Studio was built without $t.exe" }
          }
          New-Item -ItemType Directory -Force release | Out-Null
          $dest = "release\Enlangg-Studio-Setup-$env:STUDIO_VERSION.exe"
          Copy-Item $src $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          "$hash  Enlangg-Studio-Setup-$env:STUDIO_VERSION.exe" | Out-File -FilePath release\SHA256SUMS-studio -Encoding ascii
          Get-Content release\SHA256SUMS-studio

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Enlangg Studio ${{ env.STUDIO_VERSION }}
          body: |
            ## Enlangg Studio ${{ env.STUDIO_VERSION }}

            Desktop IDE for Enlangg. Installer is unsigned, so Windows SmartScreen may warn. `SHA256SUMS-studio` checks download integrity only, not author authenticity.

            Running `.enlng` programs does not need a C compiler (building native executables with `enlng build` needs `gcc`). The toolchain installer is published under the `toolchain-v*` releases.
          files: |
            release/Enlangg-Studio-Setup-${{ env.STUDIO_VERSION }}.exe
            release/SHA256SUMS-studio
