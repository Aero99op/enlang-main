name: Release Enlangg Sovereign Toolchain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Windows Executables
        run: |
          gcc -O2 enlangg.c -o enlangg.exe
          gcc -O2 enlng.c -o enlng.exe
          mkdir dist
          copy enlangg.exe dist\
          copy enlng.exe dist\
          copy install.cmd dist\
          copy install.ps1 dist\
          Compress-Archive -Path dist\* -DestinationPath enlangg-windows-amd64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enlangg-windows-amd64
          path: enlangg-windows-amd64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Linux Binaries
        run: |
          gcc -O2 enlangg.c -o enlangg
          gcc -O2 enlng.c -o enlng
          chmod +x enlangg enlng
          tar -czf enlangg-linux-amd64.tar.gz enlangg enlng install.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enlangg-linux-amd64
          path: enlangg-linux-amd64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build macOS Binaries
        run: |
          clang -O2 enlangg.c -o enlangg
          clang -O2 enlng.c -o enlng
          chmod +x enlangg enlng
          tar -czf enlangg-darwin-arm64.tar.gz enlangg enlng install.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enlangg-darwin-arm64
          path: enlangg-darwin-arm64.tar.gz

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Enlangg Sovereign Toolchain ${{ github.ref_name }}
          body: |
            ## Enlangg Sovereign Programming Language & Toolchain (${{ github.ref_name }})
            
            ### Quick Install (Windows PowerShell):
            ```powershell
            powershell -ExecutionPolicy ByPass -c "irm https://raw.githubusercontent.com/Aero99op/enlang-main/main/install.ps1 | iex"
            ```
            
            ### Quick Install (Command Prompt CMD):
            ```cmd
            curl -fsSL https://raw.githubusercontent.com/Aero99op/enlang-main/main/install.cmd -o install.cmd && install.cmd
            ```
            
            ### Quick Install (Linux & macOS):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Aero99op/enlang-main/main/install.sh | bash
            ```
            
            ### Included Domains:
            - `enlng` - Core general-purpose sovereign language (Python parity)
            - `enlngf` - Frontend natural markup & components
            - `enlngs` - Server endpoints & HTTP routing
            - `enlngd` - Design tokens & dynamic styling
            - `enlngm` - Mobile HAL & reactive hardware simulator
            - `enlngdb` - Database schemas & declarative queries
          files: |
            enlangg-windows-amd64/enlangg-windows-amd64.zip
            enlangg-linux-amd64/enlangg-linux-amd64.tar.gz
            enlangg-darwin-arm64/enlangg-darwin-arm64.tar.gz
