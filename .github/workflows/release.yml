name: Release Enlangg Sovereign Toolchain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Windows Executables
        run: |
          mkdir dist
          gcc -O2 -s -I. -Ienlngdb/c -Ienlng/c enlangg.c enlngdb/c/enlngdb.c enlngdb/c/enlngdb_parser.c enlng/c/enlng_emitter.c -o dist\enlangg.exe
          gcc -O2 -s -I. -Isrc enlng.c -o dist\enlng.exe
          gcc -O2 -s -Ienlngdb/c enlngdb/c/main.c enlngdb/c/enlngdb.c enlngdb/c/enlngdb_parser.c -o dist\enlngdb.exe
          gcc -O2 -s -I. -Ienlngf/c enlngf.c -o dist\enlngf.exe -lws2_32 -lgdi32 -luser32
          gcc -O2 -s -I. -Ienlngs/c enlngs.c -o dist\enlngs.exe
          gcc -O2 -s -I. -Ienlngd/c enlngd.c -o dist\enlngd.exe
          gcc -O2 -s -I. -Ienlngm/c enlngm.c -o dist\enlngm.exe -lgdi32 -luser32
          copy install.cmd dist\
          copy install.ps1 dist\
          copy enlangg-bridge.py dist\
          copy enlangg-bridge.cmd dist\
          Compress-Archive -Path dist\* -DestinationPath enlangg-windows-amd64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enlangg-windows-amd64
          path: enlangg-windows-amd64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Linux Binaries
        run: |
          mkdir -p dist
          gcc -O2 -s -I. -Ienlngdb/c -Ienlng/c enlangg.c enlngdb/c/enlngdb.c enlngdb/c/enlngdb_parser.c enlng/c/enlng_emitter.c -lm -o dist/enlangg
          gcc -O2 -s -I. -Isrc enlng.c -lm -o dist/enlng
          gcc -O2 -s -Ienlngdb/c enlngdb/c/main.c enlngdb/c/enlngdb.c enlngdb/c/enlngdb_parser.c -lm -o dist/enlngdb
          gcc -O2 -s -I. -Ienlngf/c enlngf.c -lm -o dist/enlngf
          gcc -O2 -s -I. -Ienlngs/c enlngs.c -lm -o dist/enlngs
          gcc -O2 -s -I. -Ienlngd/c enlngd.c -lm -o dist/enlngd
          gcc -O2 -s -I. -Ienlngm/c enlngm.c -lm -o dist/enlngm
          cp install.sh dist/
          chmod +x dist/enlangg dist/enlng dist/enlngdb dist/enlngf dist/enlngs dist/enlngd dist/enlngm dist/install.sh
          tar -czf enlangg-linux-amd64.tar.gz -C dist .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enlangg-linux-amd64
          path: enlangg-linux-amd64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build macOS Binaries
        run: |
          mkdir -p dist
          clang -O2 -I. -Ienlngdb/c -Ienlng/c enlangg.c enlngdb/c/enlngdb.c enlngdb/c/enlngdb_parser.c enlng/c/enlng_emitter.c -lm -o dist/enlangg
          clang -O2 -I. -Isrc enlng.c -lm -o dist/enlng
          clang -O2 -Ienlngdb/c enlngdb/c/main.c enlngdb/c/enlngdb.c enlngdb/c/enlngdb_parser.c -lm -o dist/enlngdb
          clang -O2 -I. -Ienlngf/c enlngf.c -lm -o dist/enlngf
          clang -O2 -I. -Ienlngs/c enlngs.c -lm -o dist/enlngs
          clang -O2 -I. -Ienlngd/c enlngd.c -lm -o dist/enlngd
          clang -O2 -I. -Ienlngm/c enlngm.c -lm -o dist/enlngm
          cp install.sh dist/
          chmod +x dist/enlangg dist/enlng dist/enlngdb dist/enlngf dist/enlngs dist/enlngd dist/enlngm dist/install.sh
          tar -czf enlangg-darwin-arm64.tar.gz -C dist .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enlangg-darwin-arm64
          path: enlangg-darwin-arm64.tar.gz

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate SHA256SUMS
        run: |
          sha256sum enlangg-windows-amd64/enlangg-windows-amd64.zip \
                    enlangg-linux-amd64/enlangg-linux-amd64.tar.gz \
                    enlangg-darwin-arm64/enlangg-darwin-arm64.tar.gz > SHA256SUMS
          sed -i 's|enlangg-[^/]*/||g' SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Enlangg Sovereign Toolchain ${{ github.ref_name }}
          body: |
            ## Enlangg Sovereign Programming Language & Toolchain (${{ github.ref_name }})
            
            > **Security Notice**: The published `SHA256SUMS` manifest verifies transmission and download integrity (guarding against transfer bitrot, incomplete downloads, and truncation). It does not cryptographically authenticate author origin as it is not an asymmetric PGP signature.
            
            ### Quick Install (Windows PowerShell):
            ```powershell
            powershell -ExecutionPolicy ByPass -c "irm https://raw.githubusercontent.com/Aero99op/enlang-main/main/install.ps1 | iex"
            ```
            
            ### Quick Install (Command Prompt CMD):
            ```cmd
            curl -fsSL https://raw.githubusercontent.com/Aero99op/enlang-main/main/install.cmd -o install.cmd && install.cmd
            ```
            
            ### Quick Install (Linux & macOS):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Aero99op/enlang-main/main/install.sh | bash
            ```
            
            ### Included Domains (Pure C 7-in-1 Suite):
            - `enlangg` - Sovereign master toolchain dispatcher
            - `enlng` - Core general-purpose sovereign language
            - `enlngdb` - Pure C microsecond database engine
            - `enlngf` - Frontend natural markup & web studio
            - `enlngs` - Reactive fullstack scripts & DOM events
            - `enlngd` - Design tokens & dynamic CSS generator
            - `enlngm` - Mobile HAL & reactive hardware simulator
          files: |
            enlangg-windows-amd64/enlangg-windows-amd64.zip
            enlangg-linux-amd64/enlangg-linux-amd64.tar.gz
            enlangg-darwin-arm64/enlangg-darwin-arm64.tar.gz
            SHA256SUMS
