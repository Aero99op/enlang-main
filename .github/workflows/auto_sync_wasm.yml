name: Auto Sync WebAssembly Engine
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'enlng.c'
      - 'enlangg.c'
      - 'lib_*.enlng'
      - 'website/enlang_engine.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run WebAssembly Auto-Sync Pipeline
        run: |
          python sync_wasm.py

      - name: Commit and Push WASM Updates if Delta Exists
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Enlang WASM Sync]"
          git add website/enlang_bundle.json
          if git diff --staged --quiet; then
            echo "WebAssembly bundle is already up to date. No changes needed."
          else
            git commit -m "chore(wasm): auto-sync WebAssembly bundle with latest compiler changes"
            git push origin main
          fi
