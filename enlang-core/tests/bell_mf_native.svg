<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI',system-ui,sans-serif; border-radius:16px; border:1px solid #1e293b;">
  <defs>
    <linearGradient id="bellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Header & Meta -->
  <rect x="0" y="0" width="950" height="70" fill="#0f172a" rx="16 16 0 0"/>
  <text x="40" y="42" fill="#c084fc" font-size="20" font-weight="800" letter-spacing="-0.5">ENLNG SCIENTIFIC PLOTTER</text>
  <text x="320" y="42" fill="#94a3b8" font-size="14" font-weight="600">|   Generalized Bell MF: μ(x; a=2.0, b=4.0, c=0.0)</text>
  <rect x="790" y="24" width="120" height="28" rx="14" fill="rgba(168,85,247,0.15)" stroke="#c084fc" stroke-width="1"/>
  <text x="850" y="42" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">ENLNG NATIVE</text>

  <!-- Bounding Chart Area: X: 110 to 860 (width 750, x from -10 to +10, 37.5px per unit), Y: 110 to 450 (height 340, μ from 0.0 to 1.0) -->
  <!-- Horizontal Grid Lines (Y: 0.0 to 1.0, 68px per 0.2) -->
  <line x1="110" y1="450" x2="860" y2="450" stroke="#334155" stroke-width="1.5"/>
  <text x="95" y="455" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">0.0</text>

  <line x1="110" y1="382" x2="860" y2="382" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="95" y="387" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">0.2</text>

  <line x1="110" y1="314" x2="860" y2="314" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="95" y="319" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">0.4</text>

  <line x1="110" y1="280" x2="860" y2="280" stroke="#475569" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="95" y="285" fill="#c084fc" font-size="13" font-weight="700" text-anchor="end">0.5</text>

  <line x1="110" y1="246" x2="860" y2="246" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="95" y="251" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">0.6</text>

  <line x1="110" y1="178" x2="860" y2="178" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="95" y="183" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">0.8</text>

  <line x1="110" y1="110" x2="860" y2="110" stroke="#334155" stroke-width="1.5"/>
  <text x="95" y="115" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">1.0</text>

  <!-- Vertical Grid Lines (X: -10 to +10, step 2 units -> 75px per 2 units) -->
  <line x1="110" y1="110" x2="110" y2="450" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="475" fill="#94a3b8" font-size="13" text-anchor="middle">-10</text>

  <line x1="185" y1="110" x2="185" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="185" y="475" fill="#94a3b8" font-size="13" text-anchor="middle">-8</text>

  <line x1="260" y1="110" x2="260" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="260" y="475" fill="#94a3b8" font-size="13" text-anchor="middle">-6</text>

  <line x1="335" y1="110" x2="335" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="335" y="475" fill="#94a3b8" font-size="13" text-anchor="middle">-4</text>

  <line x1="410" y1="110" x2="410" y2="450" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="410" y="475" fill="#c084fc" font-size="14" font-weight="700" text-anchor="middle">-2 (c-a)</text>

  <line x1="485" y1="110" x2="485" y2="450" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="485" y="475" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">0 (c)</text>

  <line x1="560" y1="110" x2="560" y2="450" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="560" y="475" fill="#c084fc" font-size="14" font-weight="700" text-anchor="middle">2 (c+a)</text>

  <line x1="635" y1="110" x2="635" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="635" y="475" fill="#94a3b8" font-size="13" text-anchor="middle">4</text>

  <line x1="710" y1="110" x2="710" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="710" y="475" fill="#94a3b8" font-size="13" text-anchor="middle">6</text>

  <line x1="785" y1="110" x2="785" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="785" y="475" fill="#94a3b8" font-size="13" text-anchor="middle">8</text>

  <line x1="860" y1="110" x2="860" y2="450" stroke="#334155" stroke-width="1.5"/>
  <text x="860" y="475" fill="#94a3b8" font-size="13" text-anchor="middle">10</text>

  <!-- Axis Titles -->
  <text x="485" y="515" fill="#cbd5e1" font-size="15" font-weight="700" text-anchor="middle">Universe of Discourse (x)</text>
  <text x="35" y="280" fill="#cbd5e1" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(-90 35 280)">Membership Degree μ(x)</text>

  <!-- Shaded Area Under Bell Curve (Filled Polygon) -->
  <path d="M 110 450 
           L 110 450 L 260 450 L 335 448.7 L 372.5 436.8 L 410 280 L 447.5 111.3 L 485 110 
           L 522.5 111.3 L 560 280 L 597.5 436.8 L 635 448.7 L 710 450 L 860 450 Z" 
        fill="url(#bellGrad)"/>

  <!-- Glowing Bell Curve Line -->
  <path d="M 110 450 
           L 335 449
           C 355 448, 385 410, 410 280
           C 425 180, 450 110, 485 110
           C 520 110, 545 180, 560 280
           C 585 410, 615 448, 635 449
           L 860 450" 
        fill="none" stroke="#c084fc" stroke-width="4" filter="url(#purpleGlow)"/>

  <!-- Key Evaluation Points & Markers -->
  <!-- 1. Center Peak: (0, 1.0) -> (485, 110) -->
  <line x1="110" y1="110" x2="485" y2="110" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="485" y1="110" x2="485" y2="450" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="485" cy="110" r="7" fill="#f43f5e" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="420" y="78" width="130" height="24" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
  <text x="485" y="94" fill="#f43f5e" font-size="12" font-weight="800" text-anchor="middle">Center: (0, 1.000)</text>

  <!-- 2. Left Crossover Point: (-2, 0.5) -> (410, 280) -->
  <line x1="110" y1="280" x2="410" y2="280" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="410" y1="280" x2="410" y2="450" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="410" cy="280" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
  <text x="395" y="272" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="end">c-a (-2, 0.500)</text>

  <!-- 3. Right Crossover Point: (+2, 0.5) -> (560, 280) -->
  <line x1="110" y1="280" x2="560" y2="280" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="560" y1="280" x2="560" y2="450" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="560" cy="280" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
  <text x="575" y="272" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="start">c+a (2, 0.500)</text>

  <!-- Legend Box -->
  <rect x="680" y="85" width="180" height="95" rx="10" fill="#131b2e" stroke="#334155" stroke-width="1.2"/>
  <line x1="695" y1="110" x2="730" y2="110" stroke="#c084fc" stroke-width="3"/>
  <circle cx="712.5" cy="110" r="4" fill="#f43f5e"/>
  <text x="740" y="114" fill="#f8fafc" font-size="12" font-weight="700">μ(x) Bell Curve</text>
  <text x="695" y="136" fill="#94a3b8" font-size="11">Width: a = 2.0</text>
  <text x="695" y="152" fill="#94a3b8" font-size="11">Slope: b = 4.0</text>
  <text x="695" y="168" fill="#94a3b8" font-size="11">Center: c = 0.0</text>
</svg>
